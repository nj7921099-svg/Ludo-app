name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo "JAVA_HOME is: $JAVA_HOME"
          
          JAVA_VER_STRING=$(java -version 2>&1 | head -n 1)
          echo "Detected version string: $JAVA_VER_STRING"
          
          MAJOR_VERSION=$(echo "$JAVA_VER_STRING" | sed -E 's/.*version "([0-9]+).*/\1/')
          if [[ -z "$MAJOR_VERSION" || ! "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Failed to detect Java major version."
            exit 1
          fi
          
          echo "Active Java major version: $MAJOR_VERSION"
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "ERROR: Java major version must be 17 or higher. Detected: $MAJOR_VERSION"
            exit 1
          fi
          echo "Java environment verified: Java $MAJOR_VERSION is active."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists. Skipping creation."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: ./debug.keystore does not exist and could not be created."
            exit 1
          fi
          echo "Temporary debug keystore is ready."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$TARGET_APK" ]; then
            echo "Target APK exists: $TARGET_APK"
            if [ ! -s "$TARGET_APK" ]; then
              echo "ERROR: $TARGET_APK is empty."
              exit 1
            fi
            echo "Verified $TARGET_APK (Size: $(stat -c%s "$TARGET_APK") bytes)"
          else
            echo "ERROR: Expected APK not found at $TARGET_APK."
            echo "Searching only inside app/build/outputs/apk..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          RELEASE_TMP_DIR=$(mktemp -d -t apk-release-XXXXXX)
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          DEST_APK="${RELEASE_TMP_DIR}/app-debug.apk"
          
          cp "$SOURCE_APK" "$DEST_APK"
          
          if [ ! -f "$DEST_APK" ] || [ ! -s "$DEST_APK" ]; then
            echo "ERROR: Failed to prepare release asset at $DEST_APK"
            exit 1
          fi
          
          echo "asset_path=$DEST_APK" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $DEST_APK"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== GitHub CLI Version ==="
          gh --version
          
          PREPARED_APK="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$PREPARED_APK" ]; then
            echo "ERROR: Prepared APK not found at $PREPARED_APK"
            exit 1
          fi
          if [ ! -s "$PREPARED_APK" ]; then
            echo "ERROR: Prepared APK is empty"
            exit 1
          fi
          if [[ "$PREPARED_APK" != *.apk ]]; then
            echo "ERROR: Asset does not have .apk extension: $PREPARED_APK"
            exit 1
          fi
          
          FILENAME=$(basename "$PREPARED_APK")
          if [ "$FILENAME" != "app-debug.apk" ]; then
            echo "ERROR: Release asset filename must be app-debug.apk. Found: $FILENAME"
            exit 1
          fi
          
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          
          RELEASE_NOTES=$(cat << 'EOF'
          ### Debug APK Build Notice
          - This is an automatically generated debug APK.
          - The APK was built by GitHub Actions.
          - GitHub Actions Run Number: ${{ github.run_number }}
          - GitHub Actions Run Attempt: ${{ github.run_attempt }}
          - Source Commit SHA: ${{ github.sha }}
          - This APK is intended for testing and development.
          - This APK is not a Play Store production release.
          - This APK is signed only with a temporary debug keystore.
          EOF
          )
          
          echo "Publishing GitHub Release with tag: $RELEASE_TAG"
          gh release create "$RELEASE_TAG" "$PREPARED_APK" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=== Release Publication Succeeded ==="
            RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            gh release view "$RELEASE_TAG"
            
            DIRECT_URL="https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk"
            echo "Direct download link: $DIRECT_URL"
            
            echo "## DIRECT APK DOWNLOAD" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "[$DIRECT_URL]($DIRECT_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The GitHub Actions backup artifact \`app-debug-apk\` remains available." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release creation did not complete successfully."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "The debug APK was built successfully."
              echo "The backup Actions artifact 'app-debug-apk' remains available for download."
            fi
            echo "## Release Notice" >> "$GITHUB_STEP_SUMMARY"
            echo "GitHub Release publishing did not complete. The backup Actions artifact \`app-debug-apk\` remains available on the Actions run summary page." >> "$GITHUB_STEP_SUMMARY"
          fi
